<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Exabyte Digital Store Logo">
  <defs>
    <linearGradient id="exaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10192E"/>
      <stop offset="60%" stop-color="#0A0F1D"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>
    <linearGradient id="exaCyber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="exaGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.32"/>
      <stop offset="40%" stop-color="#0284C7" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Cyber slate glass tile -->
  <rect x="6" y="6" width="244" height="244" rx="54" fill="url(#exaBg)" stroke="url(#exaCyber)" stroke-width="3.5"/>
  <!-- Top specular cyan sheen -->
  <path d="M 32 14 H 224 A 42 42 0 0 1 246 52 V 86 Q 128 112 10 86 V 52 A 42 42 0 0 1 32 14 Z" fill="url(#exaGlass)"/>
  <!-- Cyber HUD corner accents -->
  <path d="M 18 36 V 18 H 36" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6"/>
  <path d="M 238 36 V 18 H 220" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6"/>
  <path d="M 18 220 V 238 H 36" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6"/>
  <path d="M 238 220 V 238 H 220" fill="none" stroke="#00F0FF" stroke-width="2.5" opacity="0.6"/>
  <!-- Exabyte geometric 'E' symbol in Electric Cyan / Cyber Blue -->
  <g fill="url(#exaCyber)">
    <!-- Left vertical pillar -->
    <rect x="52" y="50" width="36" height="156" rx="3"/>
    <!-- Top angled bar -->
    <polygon points="101,50 204,50 179,86 101,86"/>
    <!-- Middle angled bar -->
    <polygon points="101,110 166,110 141,146 101,146"/>
    <!-- Bottom angled bar -->
    <polygon points="101,170 204,170 179,206 101,206"/>
  </g>
</svg>
