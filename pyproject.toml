[project]
name = "exabyte-bot"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "SIM"]
# S101 assert is fine in tests; S311 random is used only for non-security IDs (secrets module elsewhere).
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"exabyte_bot/webapp/api.py" = ["B008"]
# Burmese text legitimately contains characters ruff flags as ambiguous.
"exabyte_bot/strings.py" = ["E501", "RUF001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
